<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- fundo branco arredondado para visibilidade em qualquer browser chrome -->
  <rect width="200" height="200" rx="36" fill="#fff"/>

  <!-- capivara sentada do 4b, centrada em 200×200 (scale 0.9, translate para centralizar) -->
  <g transform="translate(32.5 23.5) scale(0.9)">
    <!-- pés -->
    <ellipse cx="52" cy="156" rx="14" ry="8" fill="#8a5a2b"/>
    <ellipse cx="98" cy="156" rx="14" ry="8" fill="#8a5a2b"/>
    <!-- corpo sentado -->
    <path d="M30 150 Q26 84 75 82 Q124 84 120 150 Z" fill="#b87d47"/>
    <ellipse cx="75" cy="120" rx="46" ry="40" fill="#a9713f"/>
    <!-- nota fiscal -->
    <g transform="rotate(6 75 118)">
      <rect x="48" y="92" width="54" height="52" rx="3" fill="#fff" stroke="#e4e9f0" stroke-width="1.5"/>
      <rect x="55" y="100" width="40" height="4" rx="2" fill="#1351B4"/>
      <rect x="55" y="110" width="40" height="3.5" rx="1.75" fill="#c9d4e8"/>
      <rect x="55" y="119" width="40" height="3.5" rx="1.75" fill="#c9d4e8"/>
      <rect x="55" y="128" width="26" height="3.5" rx="1.75" fill="#168821"/>
    </g>
    <!-- patas sobre o papel -->
    <ellipse cx="46" cy="136" rx="9" ry="7" fill="#8a5a2b"/>
    <ellipse cx="104" cy="136" rx="9" ry="7" fill="#8a5a2b"/>
    <!-- cabeça -->
    <path d="M40 66 Q38 26 75 24 Q112 26 110 66 Q110 92 75 92 Q40 92 40 66 Z" fill="#b87d47"/>
    <!-- focinho -->
    <ellipse cx="75" cy="74" rx="24" ry="17" fill="#a9713f"/>
    <ellipse cx="66" cy="72" rx="4" ry="3" fill="#5a3a1c"/>
    <ellipse cx="84" cy="72" rx="4" ry="3" fill="#5a3a1c"/>
    <!-- orelhas -->
    <circle cx="48" cy="28" r="9" fill="#8a5a2b"/>
    <circle cx="102" cy="28" r="9" fill="#8a5a2b"/>
    <!-- olhos -->
    <circle cx="60" cy="52" r="5.5" fill="#3a2412"/>
    <circle cx="61.5" cy="50" r="1.8" fill="#fff"/>
    <circle cx="90" cy="52" r="5.5" fill="#3a2412"/>
    <circle cx="91.5" cy="50" r="1.8" fill="#fff"/>
  </g>
</svg>
